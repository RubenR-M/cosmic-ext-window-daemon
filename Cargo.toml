[package]
name = "cosmic-ext-window-daemon"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "cosmic_ext_window_daemon"
path = "src/lib.rs"

[[bin]]
name = "cosmic-ext-window-daemon"
path = "src/main.rs"

[dev-dependencies]
trybuild = "1"

[dependencies]
cosmic-protocols = "=0.2.0"
cosmic-client-toolkit = "=0.2.0"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["staging"] }
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
regex = "1"
