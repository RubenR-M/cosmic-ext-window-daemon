# .github/workflows/ci.yml
# SPDX-License-Identifier: GPL-3.0-only
#
# D15 Layer 2 enforcement gate.
#
# This workflow runs `cargo clippy --all-targets -- -D warnings` as a required
# status check on every push and pull_request-to-main. The clippy check is the
# operational gate that enforces D15:
#
#   - clippy.toml lists ExtWorkspaceHandleV1::activate,
#     ExtWorkspaceGroupHandleV1::create_workspace, and
#     ExtWorkspaceManagerV1::commit as disallowed-methods.
#   - src/lib.rs and src/main.rs deny clippy::disallowed_methods at the crate root.
#   - src/wayland/workspace.rs is the sole authorized site (inner #![allow(...)]).
#
# A PR that introduces a direct call to any disallowed method outside
# wayland::workspace will fail the `clippy` step and be blocked from merging.
# SC-018 (T-012) is the test PR that demonstrates this gate blocking a bypass.
#
# After PR 2 merges, the orchestrator configures branch protection on main so
# that the `ci` status check (job name below) is a REQUIRED status check:
#
#   gh api -X PUT repos/RubenR-M/cosmic-ext-window-daemon/branches/main/protection \
#     -F required_status_checks.strict=true \
#     -F required_status_checks.contexts[]='ci' \
#     -F enforce_admins=false \
#     -F required_pull_request_reviews=null \
#     -F restrictions=null
#
# The job name MUST remain "ci" for this command to match it.

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        # `smithay-client-toolkit` (transitive dep via cosmic-client-toolkit)
        # links against `libxkbcommon`; `wayland-client` may pull in `libwayland-client`.
        # These are present on most Linux desktops by default; the GitHub Actions
        # `ubuntu-latest` image is headless and needs them installed explicitly.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned to match rust-toolchain.toml for local-vs-CI parity.
          # Update both files together when upgrading the toolchain.
          toolchain: "1.95.0"
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Verify systemd unit file (A21 — catches section-placement regressions)
        # systemd-analyze is part of the systemd package, present on ubuntu-latest
        # without any extra apt-get install. No extra install needed.
        run: systemd-analyze verify contrib/cosmic-ext-window-daemon.service

      - name: Clippy (D15 Layer 2 gate — blocks merge on disallowed_methods violations)
        run: cargo clippy --all-targets -- -D warnings
        # This step enforces the D15 invariant codebase-wide:
        # any call to ExtWorkspaceHandleV1::activate,
        # ExtWorkspaceGroupHandleV1::create_workspace, or
        # ExtWorkspaceManagerV1::commit outside wayland::workspace will cause
        # this step to fail and block the PR from merging.
        #
        # Bypassing this gate requires adding #[allow(clippy::disallowed_methods)]
        # outside wayland::workspace, which SC-018 (T-012) proves is itself caught
        # by the clippy::disallowed_methods deny at the crate root.
